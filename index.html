<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কোয়েখা তারবিয়াতুল উম্মাহ্‌ ক্যাডেট একাডেমি — KTUCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1F4B3F; --green-dark:#123028; --gold:#C9973B; --cream:#FBF7EE;
  --ink:#20241F; --sub:#5B6459; --line:#E4DCC8; --card:#FFFFFF;
  --danger:#B3492E; --ok:#2F6B4F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cream:#151915;--card:#1E241D;--ink:#EDEADF;--sub:#A9B0A2;--line:#333B31;--green:#3C7D65;}}
:root[data-theme="dark"]{--cream:#151915;--card:#1E241D;--ink:#EDEADF;--sub:#A9B0A2;--line:#333B31;--green:#3C7D65;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans Bengali',sans-serif;line-height:1.6;}
h1,h2,h3,.serif{font-family:'Noto Serif Bengali',serif;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--green-dark);color:#fff;transform:translateX(-100%);transition:transform .25s ease;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-y:auto;}
.sidebar.open{transform:translateX(0);}
.side-brand{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.15);}
.side-brand .name{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:1rem;display:block;}
.side-brand .sub{font-size:.72rem;opacity:.75;}
nav#tabBar{display:flex;flex-direction:column;padding:10px;gap:2px;}
nav#tabBar button{text-align:left;background:transparent;border:none;color:#EDE7D3;padding:11px 12px;font-size:.9rem;border-radius:8px;cursor:pointer;font-family:inherit;border-left:3px solid transparent;}
nav#tabBar button.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600;border-left:3px solid var(--gold);}
.side-footer{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.15);}
.role-badge{font-size:.72rem;color:#C7D9CE;margin-bottom:8px;padding:0 4px;}
.role-badge b{color:#fff;}
.side-footer button{width:100%;padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;font-family:inherit;font-size:.83rem;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25;display:none;}
.overlay.open{display:block;}
.content-wrap{min-height:100vh;}
header{background:var(--green);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:10;}
.top-row{display:flex;align-items:center;gap:10px;}
.hamburger{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:8px 11px;font-size:1rem;cursor:pointer;line-height:1;}
.brand{display:flex;flex-direction:column;flex:1;min-width:0;}
.brand .name{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand .sub{font-size:.7rem;opacity:.8;}
.gear{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 10px;font-size:.8rem;cursor:pointer;flex:0 0 auto;}
.lang-panel{display:none;background:var(--green-dark);padding:10px 16px;gap:8px;margin:0 -16px -12px;}
.lang-panel.open{display:flex;padding-top:10px;margin-top:10px;}
.lang-panel button{flex:1;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;font-family:inherit;}
.lang-panel button.active{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:600;}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px;}
section{display:none;}
section.active{display:block;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
.card h3{margin:0 0 8px;font-size:1.02rem;}
.badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:20px;background:var(--gold);color:#3a2c08;font-weight:600;margin-left:6px;vertical-align:middle;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.grid2{grid-template-columns:1fr;}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;}
.stat .num{font-family:'Noto Serif Bengali',serif;font-size:1.5rem;font-weight:700;color:var(--green);}
.stat .num.exp{color:var(--danger);}
.stat .lbl{font-size:.8rem;color:var(--sub);}
table{width:100%;border-collapse:collapse;font-size:.88rem;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:600;font-size:.78rem;}
.tablewrap{overflow-x:auto;}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.75rem;font-weight:600;}
.tag.present{background:#E4F0E8;color:var(--ok);}
.tag.absent{background:#F7E4DE;color:var(--danger);}
.tag.late{background:#FBF0DA;color:#96731A;}
.tag.paid{background:#E4F0E8;color:var(--ok);}
.tag.due{background:#FBF0DA;color:#96731A;}
:root[data-theme="dark"] .tag.present,:root:not([data-theme="light"]) .tag.present{background:#20362A;}
:root[data-theme="dark"] .tag.absent,:root:not([data-theme="light"]) .tag.absent{background:#3A241F;}
:root[data-theme="dark"] .tag.late,:root:not([data-theme="light"]) .tag.late{background:#3A311A;}
:root[data-theme="dark"] .tag.paid,:root:not([data-theme="light"]) .tag.paid{background:#20362A;}
:root[data-theme="dark"] .tag.due,:root:not([data-theme="light"]) .tag.due{background:#3A311A;}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.people{grid-template-columns:1fr;}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;}
.pcard .av{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Bengali',serif;font-weight:700;margin-bottom:8px;}
.pcard .pname{font-weight:600;font-size:.92rem;}
.pcard .prole{font-size:.78rem;color:var(--sub);}
label{display:block;font-size:.82rem;color:var(--sub);margin:10px 0 4px;}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink);font-family:inherit;font-size:.92rem;}
.btn{margin-top:14px;width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.92rem;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.hint{font-size:.76rem;color:var(--sub);margin-top:8px;}
.notice{background:#F7E4DE;color:var(--danger);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-top:10px;}
.notice.info{background:#FBF0DA;color:#7A5A10;}
:root[data-theme="dark"] .notice,:root:not([data-theme="light"]) .notice{background:#3A241F;}
:root[data-theme="dark"] .notice.info,:root:not([data-theme="light"]) .notice.info{background:#3A311A;}
.steps{margin:0;padding-left:18px;}
.steps li{margin-bottom:6px;font-size:.9rem;}
footer{text-align:center;font-size:.76rem;color:var(--sub);padding:20px;}
.searchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:420px){.searchgrid{grid-template-columns:1fr;}}
.stu-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.stu-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;}
.stu-head .who{display:flex;flex-direction:column;}
.stu-head .snm{font-weight:600;font-size:.94rem;}
.stu-head .smeta{font-size:.76rem;color:var(--sub);}
.stu-head .sactions{display:flex;gap:6px;flex:0 0 auto;}
.iconbtn{background:var(--green);color:#fff;border:none;border-radius:7px;padding:7px 10px;font-size:.78rem;cursor:pointer;font-family:inherit;}
.stu-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.86rem;}
.stu-detail.open{display:block;}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:8px;}
.dl div span{color:var(--sub);}
.dsec{font-weight:600;color:var(--green);margin:8px 0 4px;font-size:.82rem;}
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px;}
  .sidebar,header,footer,.overlay{display:none !important;}
}
@media(min-width:860px){.sidebar{transform:translateX(0);}.overlay{display:none !important;}.content-wrap{margin-left:230px;}.hamburger{display:none;}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <span class="name">কোয়েখা তারবিয়াতুল উম্মাহ্‌ ক্যাডেট একাডেমি</span>
    <span class="sub">ktuca.edu.bd</span>
  </div>
  <nav id="tabBar"></nav>
  <div class="side-footer">
    <div class="role-badge" id="roleBadge"></div>
    <button id="logoutBtn" style="display:none;"></button>
  </div>
</aside>

<div class="content-wrap">
<header>
  <div class="top-row">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div class="brand">
      <span class="name">কোয়েখা তারবিয়াতুল উম্মাহ্‌ ক্যাডেট একাডেমি</span>
      <span class="sub">ktuca.edu.bd</span>
    </div>
    <button class="gear" id="gearBtn">⚙ <span id="gearLbl">ভাষা</span></button>
  </div>
  <div class="lang-panel" id="langPanel">
    <button data-lang="bn" id="btnBn">বাংলা</button>
    <button data-lang="en" id="btnEn">English</button>
  </div>
</header>

<main>
  <section id="home" class="active">
    <div class="card">
      <h1 class="serif" id="homeTitle" style="margin:0 0 4px;font-size:1.25rem;"></h1>
      <p id="homeLoc" style="color:var(--sub);margin:0 0 10px;font-size:.88rem;"></p>
      <p id="homeAbout" style="margin:0;"></p>
    </div>
    <div class="card"><h3 id="contactTitle"></h3><p id="contactBody" style="margin:0;font-size:.9rem;color:var(--sub);"></p></div>
  </section>

  <section id="admission">
    <div class="card" id="admEntryForm" style="display:none;">
      <h3 id="admEntryTitle"></h3>
      <p style="color:var(--sub);font-size:.85rem;margin:0 0 6px;" id="admEntryDesc"></p>
      <label id="lblAeName"></label><input id="aeName">
      <label id="lblAeFather"></label><input id="aeFather">
      <label id="lblAeMother"></label><input id="aeMother">
      <label id="lblAeDob"></label><input id="aeDob" type="date">
      <label id="lblAeBirthReg"></label><input id="aeBirthReg">
      <label id="lblAeFatherMobile"></label><input id="aeFatherMobile">
      <label id="lblAeGuardianMobile"></label><input id="aeGuardianMobile">
      <label id="lblAeClass"></label><select id="aeClass"></select>
      <label id="lblAeRoll"></label><input id="aeRoll" type="number" min="1">
      <button class="btn" id="aeSubmitBtn"></button>
      <div class="notice info" id="aeSuccess" style="display:none;"></div>
    </div>
    <div class="card"><h3 id="admIntroTitle"></h3><p id="admIntroBody" style="margin:0;color:var(--sub);font-size:.9rem;"></p></div>
    <div class="card"><h3 id="admStepsTitle"></h3><ol class="steps" id="admSteps"></ol></div>
    <div class="card"><h3 id="admDocsTitle"></h3><ol class="steps" id="admDocs"></ol></div>
    <div class="card"><h3 id="admContactTitle"></h3><p id="admContactBody" style="margin:0;color:var(--sub);font-size:.9rem;"></p></div>
  </section>

  <section id="notice">
    <div class="card" id="staffNoticeForm" style="display:none;">
      <h3 id="noticeAddTitle"></h3>
      <label id="lblNoticeTitle"></label><input id="noticeTitleInput">
      <label id="lblNoticeBody"></label><input id="noticeBodyInput">
      <button class="btn" id="addNoticeBtn"></button>
    </div>
    <div class="card"><h3 id="noticeBoardTitle"></h3><div id="noticeList"></div></div>
  </section>

  <section id="parentLogin">
    <div class="card">
      <h3 id="parentTitle"></h3>
      <p style="color:var(--sub);font-size:.88rem;margin:0 0 8px;" id="parentDesc"></p>
      <div id="plTabs" style="display:flex;gap:6px;margin:8px 0;"></div>
      <div id="plBody"></div>
      <div class="notice" id="parentLoginError" style="display:none;"></div>
    </div>
  </section>

  <section id="staffLogin">
    <div class="card">
      <h3 id="staffTitle"></h3>
      <p style="color:var(--sub);font-size:.88rem;margin:0;" id="staffDesc"></p>
      <label id="lblStaffId"></label><input id="staffId" placeholder="staff">
      <label id="lblStaffPass"></label><input id="staffPass" type="password" placeholder="••••••">
      <button class="btn" id="staffLoginBtn"></button>
      <p class="hint" id="staffDemoHint"></p>
      <div class="notice" id="staffLoginError" style="display:none;"></div>
    </div>
  </section>

  <section id="mydash">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <h3 id="pdName" style="margin:0;"></h3>
        <button class="iconbtn" id="pdPrintBtn"></button>
      </div>
      <p style="color:var(--sub);font-size:.85rem;margin:4px 0 0;" id="pdClass"></p>
    </div>
    <div id="mydashProfile"></div>
  </section>

  <section id="settings">
    <div class="card">
      <h3 id="settingsTitle"></h3>
      <p style="color:var(--sub);font-size:.85rem;margin:0 0 6px;" id="settingsDesc"></p>
      <div id="visibilityToggles"></div>
    </div>
    <div class="card">
      <h3 id="scoreMgmtTitle"></h3>
      <p class="hint" id="scoreMgmtDesc" style="margin:0 0 8px;"></p>
      <div id="scoreCatList"></div>
      <div style="margin-top:10px;">
        <label id="lblScName"></label><input id="scName">
        <label id="lblScWho"></label><select id="scWho"></select>
        <label id="lblScMax"></label><input id="scMax" type="number" min="1">
        <button class="btn" id="scAddBtn"></button>
      </div>
    </div>
    <div class="card">
      <h3 id="scoreRulesTitle"></h3>
      <p class="hint" id="scoreRulesDesc" style="margin:0 0 8px;"></p>
      <div id="scoreRuleList"></div>
      <div style="margin-top:10px;">
        <label id="lblSrName"></label><input id="srName">
        <label id="lblSrType"></label><select id="srType"></select>
        <label id="lblSrStudent"></label><input id="srStudent" type="number" min="0" value="0">
        <label id="lblSrGuardian"></label><input id="srGuardian" type="number" min="0" value="0">
        <button class="btn" id="srAddBtn"></button>
      </div>
    </div>
  </section>

  <section id="loginLog">
    <div class="card"><h3 id="loginLogTitle"></h3><p class="hint" id="loginLogDesc" style="margin:0 0 8px;"></p><div class="tablewrap"><table id="loginLogTable"></table></div></div>
  </section>

  <section id="payment">
    <div class="card">
      <h3 id="payDueTitle"></h3>
      <div class="tablewrap"><table id="payDueTable"></table></div>
      <button class="btn" id="payNowBtn" disabled></button>
      <div class="notice info" id="payGatewayNotice"></div>
    </div>
    <div class="card"><h3 id="payHistTitle"></h3><div class="tablewrap"><table id="payHistTable"></table></div></div>
  </section>

  <section id="students">
    <div class="card">
      <h3 id="studentsTitle"></h3>
      <div class="searchgrid">
        <div><label id="lblSearchName"></label><input id="sNameSearch" placeholder=""></div>
        <div><label id="lblSearchRoll"></label><input id="sRollSearch" placeholder=""></div>
        <div><label id="lblSearchClass"></label><select id="sClassFilter"></select></div>
        <div><label id="lblSearchResult"></label><select id="sResultFilter"></select></div>
      </div>
      <button class="btn ghost" id="printListBtn"></button>
      <p class="hint" id="sCountHint"></p>
    </div>
    <div id="studentsRichList"></div>
  </section>
  <div id="printArea"></div>
  <section id="teachers"><div class="card"><h3 id="teachersTitle"></h3><div class="people" id="teachersList"></div></div></section>
  <section id="attendance">
    <div class="card">
      <h3 id="attTitle"></h3>
      <p class="hint" id="attDateNote" style="margin-top:2px;"></p>
      <div id="attClassTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;"></div>
      <div class="notice info" id="attEditNotice"></div>
    </div>
    <div id="attList"></div>
  </section>
  <section id="finance">
    <div class="grid2" style="margin-bottom:14px;">
      <div class="stat"><div class="num" id="finIncomeNum"></div><div class="lbl" id="finIncomeLbl"></div></div>
      <div class="stat"><div class="num exp" id="finExpenseNum"></div><div class="lbl" id="finExpenseLbl"></div></div>
    </div>
    <div class="card"><h3 id="finTableTitle"></h3><div class="tablewrap"><table id="finTable"></table></div></div>
  </section>
  <section id="routine">
    <div class="card"><h3 id="routineTitle"></h3><div class="tablewrap"><table id="routineTable"></table></div></div>
    <div class="card"><h3 id="examTitle"></h3><div class="tablewrap"><table id="examTable"></table></div></div>
  </section>
  <section id="results"><div class="card"><h3 id="resultsTitle"></h3><div class="tablewrap"><table id="resultsTable"></table></div></div></section>
</main>
<footer id="footNote"></footer>
</div>

<script>
const T = {
 bn:{tabs:{home:"হোম",admission:"ভর্তি",notice:"নোটিশ বোর্ড",parentLogin:"অভিভাবক লগইন",staffLogin:"স্টাফ লগইন",mydash:"আমার তথ্য",payment:"পেমেন্ট",
  finance:"আয়-ব্যয়",students:"স্টুডেন্ট",teachers:"টিচার",attendance:"এটেন্ডেন্সি",routine:"রুটিন ও পরীক্ষা",results:"ফলাফল",settings:"সেটিংস",loginLog:"লগইন লগ"},
  settingsTitle:"প্রোফাইল দৃশ্যমানতা সেটিংস",settingsDesc:"অভিভাবকরা স্টুডেন্ট প্রোফাইলের কোন কোন অংশ দেখতে পারবে, তা এখান থেকে ঠিক করুন।",
  scoreMgmtTitle:"স্কোর ম্যানেজমেন্ট",scoreMgmtDesc:"স্কোরে নতুন বিষয়/খাত যুক্ত করুন — কার জন্য (শিক্ষার্থী/অভিভাবক/উভয়ে) ও সর্বোচ্চ নম্বর ঠিক করে দিন।",
  lblScName:"বিষয়ের নাম",lblScWho:"কার জন্য",lblScMax:"সর্বোচ্চ নম্বর",scAddBtn:"যুক্ত করুন",scRemove:"মুছুন",
  scWhoStudent:"শিক্ষার্থী",scWhoGuardian:"অভিভাবক",scWhoBoth:"উভয়ে",scMaxShort:"সর্বোচ্চ",

function rows(container,cols,data,tagIndex){
  let html="<tr>"+cols.map(c=>`<th>${c}</th>`).join("")+"</tr>";
  data.forEach(r=>{
    html+="<tr>"+r.map((cell,i)=>{
      if(i===tagIndex){
        const map={present:{bn:"উপস্থিত",en:"Present"},absent:{bn:"অনুপস্থিত",en:"Absent"},late:{bn:"বিলম্বিত",en:"Late"},paid:{bn:"পরিশোধিত",en:"Paid"},due:{bn:"বকেয়া",en:"Due"}};
        return `<td><span class="tag ${cell}">${map[cell][lang]}</span></td>`;
      }
      return `<td>${cell}</td>`;
    }).join("")+"</tr>";
  });
  container.innerHTML=html;
}

  document.getElementById("plBody").innerHTML=h;
  document.querySelectorAll("#plBody .pa-link").forEach(b=>b.onclick=()=>{paReset(b.dataset.m);renderParentAuth();});
  const nx=document.getElementById("paNext"); if(nx) nx.onclick=paNext;
  const box=document.getElementById("parentLoginError");
  if(pa.msg){box.style.display="block";box.className="notice"+(pa.msg.type==="info"?" info":"");box.textContent=pa.msg.text;}
  else box.style.display="none";
}
function paNext(){
  const t=T[lang];
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const newOtp=()=>{pa.otp=String(Math.floor(100000+Math.random()*900000));};
  if(pa.step===1){
    pa.mobile=v("paMobile");
    if(pa.mode==="forgotroll"){
      const list=richStudents.filter(st=>st.guardianMobile===pa.mobile);
      if(!list.length) return paFail(t.paErrNoMobile);
      pa.rolls=list;
    }else{
      pa.code=v("paCode");
      if(!paMatch(pa.mobile,pa.code)) return paFail(t.paErrNoMatch);
      const reg=parentRegistry[pa.code];
      if(pa.mode==="signin"){
        pa.pw=v("paPw");
        if(!reg||reg.mobile!==pa.mobile) return paFail(t.paErrNotReg);
        if(reg.pw!==pa.pw) return paFail(t.paErrPw);
      }
      if(pa.mode==="signup"&&reg) return paFail(t.paErrAlreadyReg);
      if(pa.mode==="forgotpw"&&!reg) return paFail(t.paErrNotReg);
    }
    if(pa.mode==="signin"){
      const code=pa.code;logLogin(pa.mobile+" ("+code+")","parent");
      paReset("signin");
      role="parent";loggedInId=code;currentTab="mydash";
      render();showTab("mydash");return;
    }
    newOtp();pa.step=2;pa.msg=null;return renderParentAuth();
  }
  if(pa.step===2){
    if(v("paOtp")!==pa.otp) return paFail(t.paErrOtp);
    if(pa.mode==="signin"){
      const code=pa.code;logLogin(pa.mobile+" ("+code+")","parent");
      paReset("signin");
      role="parent";loggedInId=code;currentTab="mydash";
      render();showTab("mydash");return;
    }
    pa.step=3;pa.msg=null;return renderParentAuth();
  }
  if(pa.step===3){
    const p1=v("paPw1"),p2=v("paPw2");
    if(p1.length<6) return paFail(t.paErrPwShort);
    if(p1!==p2) return paFail(t.paErrPwMismatch);
    parentRegistry[pa.code]={mobile:pa.mobile,pw:p1};
    const text=pa.mode==="signup"?t.paSignedUp:t.paPwReset;
    paReset("signin");pa.msg={text,type:"info"};renderParentAuth();
  }
}

function sumBy(arr,f){return (arr||[]).reduce((a,x)=>a+f(x),0);}
function scoreHTML(s,t){
  const val=k=>(s.scores&&s.scores[k]!==undefined)?s.scores[k]:0;
  const studentCats=scoreCategories.filter(c=>c.who==="student");
  const guardianCats=scoreCategories.filter(c=>c.who==="guardian");
  const sBase=sumBy(studentCats,c=>val(c.key)), sMax=sumBy(studentCats,c=>c.max);
  const gBase=sumBy(guardianCats,c=>val(c.key)), gMax=sumBy(guardianCats,c=>c.max);
  const plusS=sumBy(s.bonusLog,x=>x.student), plusG=sumBy(s.bonusLog,x=>x.guardian);
  const minS=sumBy(s.absenceLog,a=>a.studentDeduct)+sumBy(s.penaltyLog,x=>x.student);
  const minG=sumBy(s.absenceLog,a=>a.guardianDeduct)+sumBy(s.penaltyLog,x=>x.guardian);
  const netS=sBase+plusS-minS, netG=gBase+plusG-minG;
  const lbl=c=>lang==="bn"?c.labelBn:c.labelEn;
  const line="font-size:.8rem;color:var(--sub);padding:4px 0;border-bottom:1px dashed var(--line);";
  let html=`<div class="dsec">${t.secScore}</div>`;
  html+=`<div style="font-weight:600;margin:2px 0 0;">${t.fScoreStudent} — <span style="color:var(--green);">${t.scNet}: ${netS}</span></div>`;
  html+=`<div style="font-size:.78rem;color:var(--sub);margin-bottom:4px;">${t.scBase} ${sBase}/${sMax} · <span style="color:var(--ok);">+${plusS}</span> · <span style="color:var(--danger);">−${minS}</span></div>`;
  html+=`<div class="dl" style="margin-bottom:8px;">`+studentCats.map(c=>`<div><span>${lbl(c)}:</span> ${val(c.key)}/${c.max}</div>`).join("")+`</div>`;
  html+=`<div style="font-weight:600;margin:2px 0 0;">${t.fScoreGuardian} — <span style="color:var(--green);">${t.scNet}: ${netG}</span></div>`;
  html+=`<div style="font-size:.78rem;color:var(--sub);margin-bottom:4px;">${t.scBase} ${gBase}/${gMax} · <span style="color:var(--ok);">+${plusG}</span> · <span style="color:var(--danger);">−${minG}</span></div>`;
  html+=`<div class="dl" style="margin-bottom:8px;">`+guardianCats.map(c=>`<div><span>${lbl(c)}:</span> ${val(c.key)}/${c.max}</div>`).join("")+`</div>`;
  if(s.bonusLog && s.bonusLog.length){
    html+=`<div style="font-weight:600;margin:4px 0 2px;font-size:.85rem;color:var(--ok);">${t.plusLogTitle}</div>`;
    html+=s.bonusLog.map(x=>`<div style="${line}">${x.date} — ${ruleLabel(x.ruleKey)} · ${t.fScoreStudent} +${x.student}, ${t.fScoreGuardian} +${x.guardian}</div>`).join("");
  }
  if((s.absenceLog&&s.absenceLog.length)||(s.penaltyLog&&s.penaltyLog.length)){
    html+=`<div style="font-weight:600;margin:4px 0 2px;font-size:.85rem;color:var(--danger);">${t.minusLogTitle}</div>`;
    html+=(s.absenceLog||[]).map(a=>`<div style="${line}">${a.date} — ${t.reasonLabels[a.reason]} (${t.reportedDayLabels[a.reportedDay]}) · ${t.fScoreStudent} −${a.studentDeduct}, ${t.fScoreGuardian} −${a.guardianDeduct}</div>`).join("");
    html+=(s.penaltyLog||[]).map(x=>`<div style="${line}">${x.date} — ${ruleLabel(x.ruleKey)} · ${t.fScoreStudent} −${x.student}, ${t.fScoreGuardian} −${x.guardian}</div>`).join("");
  }
  return html;
}

function printOneStudent(code,resultFilter){
  const s=findByCode(code); if(!s) return;
  const t=T[lang];
  document.getElementById("printArea").innerHTML=`
    <h2 style="margin-bottom:2px;">${t.homeTitle}</h2>
    <div style="color:#555;margin-bottom:14px;">${t.studentsTitle} — ${s.name}</div>
    ${fullProfileHTML(s,t,{personal:true,academic:true,score:true,result:true,fee:true})}`;
  window.print();
}
function printStudentList(){
  const t=T[lang];
  const list=matchStudents();
  const resultFilter=(document.getElementById("sResultFilter").dataset.key)||"all";
  let html=`<h2>${t.homeTitle}</h2><div style="color:#555;margin-bottom:12px;">${t.studentsTitle}</div>
    <table style="width:100%;border-collapse:collapse;"><tr>
    <th style="text-align:left;border-bottom:1px solid #999;padding:4px;">${t.fName}</th>
    <th style="text-align:left;border-bottom:1px solid #999;padding:4px;">${t.fClass}</th>
    <th style="text-align:left;border-bottom:1px solid #999;padding:4px;">${t.fRoll}</th>
    <th style="text-align:left;border-bottom:1px solid #999;padding:4px;">${t.fUnique}</th>
    <th style="text-align:left;border-bottom:1px solid #999;padding:4px;">${t.resultOptions[resultFilter]||t.secResult}</th>
    <th style="text-align:left;border-bottom:1px solid #999;padding:4px;">${t.fGuardianMobile}</th>
    </tr>`+list.map(s=>`<tr>
      <td style="padding:4px;border-bottom:1px solid #ddd;">${s.name}</td>
      <td style="padding:4px;border-bottom:1px solid #ddd;">${t.classOptions[s.classKey]}</td>
      <td style="padding:4px;border-bottom:1px solid #ddd;">${s.roll}</td>
      <td style="padding:4px;border-bottom:1px solid #ddd;">${uniqueCode(s.classKey,s.roll,s.year)}</td>
      <td style="padding:4px;border-bottom:1px solid #ddd;">${resultBlock(s,resultFilter,t,", ")}</td>
      <td style="padding:4px;border-bottom:1px solid #ddd;">${s.guardianMobile}</td>
    </tr>`).join("")+`</table>`;
  document.getElementById("printArea").innerHTML=html;
  window.print();
}

document.getElementById("hamburgerBtn").onclick=openSidebar;
document.getElementById("overlay").onclick=closeSidebar;
document.getElementById("gearBtn").onclick=()=>document.getElementById("langPanel").classList.toggle("open");
document.getElementById("btnBn").onclick=()=>{lang="bn";render();};
document.getElementById("btnEn").onclick=()=>{lang="en";render();};

document.getElementById("staffLoginBtn").onclick=()=>{
  const id=document.getElementById("staffId").value.trim();
  const pass=document.getElementById("staffPass").value.trim();
  const err=document.getElementById("staffLoginError");
  if(staffAccounts[id] && staffAccounts[id]===pass){
    err.style.display="none"; logLogin(id,"staff"); role="staff"; currentTab="students";
    render(); showTab("students");
  }else{ err.style.display="block"; }
};
document.getElementById("logoutBtn").onclick=()=>{
  role="guest"; loggedInId=null; currentTab="home";
  paReset("signin");
  document.getElementById("staffId").value=""; document.getElementById("staffPass").value="";
  render(); showTab("home"); closeSidebar();
};
document.getElementById("payNowBtn").onclick=()=>{};
document.getElementById("sNameSearch").oninput=renderStudentsList;
document.getElementById("sRollSearch").oninput=renderStudentsList;
document.getElementById("printListBtn").onclick=printStudentList;
document.getElementById("addNoticeBtn").onclick=()=>{
  const title=document.getElementById("noticeTitleInput").value.trim();
  const body=document.getElementById("noticeBodyInput").value.trim();
  if(!title) return;
  const today=new Date();
  const dateStr=today.toLocaleDateString(lang==="bn"?"bn-BD":"en-US",{day:"numeric",month:"short"});
  notices.unshift({dateBn:dateStr,dateEn:dateStr,titleBn:title,titleEn:title,bodyBn:body,bodyEn:body});
  document.getElementById("noticeTitleInput").value="";
  document.getElementById("noticeBodyInput").value="";
  render();
};

render();
